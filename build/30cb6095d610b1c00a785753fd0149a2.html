    n:{x:{c:&#x27;done&#x27;,v:&#x27;= &#x27;+R(X0)},y:{c:&#x27;done&#x27;,v:&#x27;= &#x27;+R(Y0)},v1:{c:&#x27;ar&#x27;,v:&#x27;= &#x27;+R(V1),d:&#x27;v̄₁ = &#x27;+R(v1_bar),dc:&#x27;cr&#x27;},v2:{c:&#x27;ar&#x27;,v:&#x27;= &#x27;+R(V2),d:&#x27;v̄₂ = &#x27;+R(v2_bar),dc:&#x27;cr&#x27;},f:{c:&#x27;done&#x27;,v:&#x27;= &#x27;+R(VF),d:&#x27;f̄ = 1.000&#x27;,dc:&#x27;cs&#x27;}},

  { t:&#x27;Traiter φ₂ (add) → envoyer x̄ et ȳ&#x27;,

    fl:[{e:1,d:&#x27;r&#x27;,lbl:&#x27;v̄₂&#x27;},{e:2,d:&#x27;r&#x27;,lbl:&#x27;v̄₂&#x27;}],bd:[{x:100,y:110,t:&#x27;+&#x27;+R(xbar_via_phi2),cl:&#x27;pr&#x27;},{x:100,y:172,t:&#x27;via φ₂&#x27;,cl:&#x27;pr&#x27;,sm:1}]},

var nkeys = [&#x27;x&#x27;,&#x27;y&#x27;,&#x27;v1&#x27;,&#x27;v2&#x27;,&#x27;f&#x27;];
var nels  = {x:&#x27;Nx&#x27;,y:&#x27;Ny&#x27;,v1:&#x27;Nv1&#x27;,v2:&#x27;Nv2&#x27;,f:&#x27;Nf&#x27;};
function steps() { return mode === &#x27;f&#x27; ? fwd : rev; }

function clearLayers() {
  $(&#x27;FL&#x27;).innerHTML = &#x27;&#x27;; $(&#x27;PL&#x27;).innerHTML = &#x27;&#x27;; $(&#x27;BL&#x27;).innerHTML = &#x27;&#x27;;
  pulseFrames.forEach(function(id) { cancelAnimationFrame(id); });
  pulseFrames = [];
}

function mkLine(ei, dir) {
  var e=E[ei], ns=&#x27;http://www.w3.org/2000/svg&#x27;;
  var sx,sy,tx,ty;
  if(dir===&#x27;f&#x27;){sx=e[0];sy=e[1];tx=e[2];ty=e[3];}
  else{sx=e[2];sy=e[3];tx=e[0];ty=e[1];}
  var ln=document.createElementNS(ns,&#x27;line&#x27;);
  ln.setAttribute(&#x27;x1&#x27;,sx);ln.setAttribute(&#x27;y1&#x27;,sy);ln.setAttribute(&#x27;x2&#x27;,tx);ln.setAttribute(&#x27;y2&#x27;,ty);
  ln.setAttribute(&#x27;class&#x27;,&#x27;fline fl-&#x27;+dir);
  $(&#x27;FL&#x27;).appendChild(ln);
  // Arrowhead via polygon with inline styles (immune to external CSS)
  var color = getColor(dir===&#x27;f&#x27;?&#x27;--c-fwd&#x27;:&#x27;--c-rev&#x27;) || (dir===&#x27;f&#x27;?&#x27;#185fa5&#x27;:&#x27;#a32d2d&#x27;);
  var ang=Math.atan2(ty-sy,tx-sx), aLen=9, aSpread=0.4;

  var x1=tx-aLen*Math.cos(ang-aSpread), y1=ty-aLen*Math.sin(ang-aSpread);
  var x2=tx-aLen*Math.cos(ang+aSpread), y2=ty-aLen*Math.sin(ang+aSpread);
  p.setAttribute(&#x27;points&#x27;,x1+&#x27;,&#x27;+y1+&#x27; &#x27;+tx+&#x27;,&#x27;+ty+&#x27; &#x27;+x2+&#x27;,&#x27;+y2);
  p.style.fill = color;
  p.style.stroke = &#x27;none&#x27;;
  p.style.opacity = &#x27;1&#x27;;

}

function mkPulse(ei, dir, delay) {
  var e = E[ei], ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  var sx,sy,tx,ty;
  if (dir===&#x27;f&#x27;){sx=e[0];sy=e[1];tx=e[2];ty=e[3];}else{sx=e[2];sy=e[3];tx=e[0];ty=e[1];}
  var c = document.createElementNS(ns,&#x27;circle&#x27;);
  c.setAttribute(&#x27;r&#x27;,&#x27;6&#x27;);
  c.setAttribute(&#x27;fill&#x27;,dir===&#x27;f&#x27;?&#x27;var(--info-tx)&#x27;:&#x27;var(--danger-tx)&#x27;);

  $(&#x27;PL&#x27;).appendChild(c);

  function tick(ts){

    if(elapsed&lt;0){pulseFrames.push(requestAnimationFrame(tick));return;}
    var t=Math.min(1,elapsed/dur);
    var ease=t&lt;0.5?2*t*t:(1-Math.pow(-2*t+2,2)/2);
    c.setAttribute(&#x27;cx&#x27;,sx+(tx-sx)*ease);c.setAttribute(&#x27;cy&#x27;,sy+(ty-sy)*ease);
    c.setAttribute(&#x27;opacity&#x27;,t&lt;0.1?t/0.1:(t&gt;0.85?(1-t)/0.15:0.85));
    if(t&lt;1)pulseFrames.push(requestAnimationFrame(tick));else c.remove();
  }
  pulseFrames.push(requestAnimationFrame(tick));
}

function mkBadge(bx,by,txt,cl,sm){
  var ns=&#x27;http://www.w3.org/2000/svg&#x27;;
  var g=document.createElementNS(ns,&#x27;g&#x27;);g.setAttribute(&#x27;class&#x27;,&#x27;badge&#x27;);

function render(){

  });

}

function go(d){var S=steps();step=Math.max(0,Math.min(S.length-1,step+d));render();}

$(&#x27;tb-f&#x27;).onclick=function(){mode=&#x27;f&#x27;;step=0;$(&#x27;tb-f&#x27;).className=&#x27;ad-tab on&#x27;;$(&#x27;tb-r&#x27;).className=&#x27;ad-tab&#x27;;render();};

$(&#x27;bp&#x27;).onclick=function(){go(-1);};

buildStaticArrows();

})();
