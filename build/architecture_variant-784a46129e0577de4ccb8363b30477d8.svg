<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif;">
<style>
  text { fill: #333333; }
  .label { font-size: 14px; font-weight: 500; }
  .sub { font-size: 12px; fill: #737373; }
  .tiny { font-size: 10px; fill: #737373; }
  @media (prefers-color-scheme: dark) {
    text { fill: #c2c0b6; }
    .sub { fill: #9c9a92; }
    .tiny { fill: #9c9a92; }
    .gray-box { fill: #444441; stroke: #B4B2A9; }
    .gray-text { fill: #D3D1C7; }
    .divider { stroke: #5F5E5A; }
    .matrix-bg { fill: #2C2C2A; stroke: #5F5E5A; }
    .masked-cell { fill: #444441; }
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- === COLUMN 1: Encoder (BERT) === -->
<text class="label" x="110" y="24" text-anchor="middle">Encodeur</text>
<text class="sub" x="110" y="40" text-anchor="middle">BERT</text>

<!-- Attention matrix: full (bidirectional) -->
<g transform="translate(72, 56)">
<rect width="76" height="76" fill="white" stroke="#D3D1C7" stroke-width="0.5" rx="4" class="matrix-bg"/>
<rect x="4" y="4" width="13" height="13" fill="#7F77DD" opacity="0.6" rx="1"/>
<rect x="20" y="4" width="13" height="13" fill="#7F77DD" opacity="0.3" rx="1"/>
<rect x="36" y="4" width="13" height="13" fill="#7F77DD" opacity="0.15" rx="1"/>
<rect x="52" y="4" width="13" height="13" fill="#7F77DD" opacity="0.4" rx="1"/>
<rect x="4" y="20" width="13" height="13" fill="#7F77DD" opacity="0.3" rx="1"/>
<rect x="20" y="20" width="13" height="13" fill="#7F77DD" opacity="0.6" rx="1"/>
<rect x="36" y="20" width="13" height="13" fill="#7F77DD" opacity="0.5" rx="1"/>
<rect x="52" y="20" width="13" height="13" fill="#7F77DD" opacity="0.2" rx="1"/>
<rect x="4" y="36" width="13" height="13" fill="#7F77DD" opacity="0.15" rx="1"/>
<rect x="20" y="36" width="13" height="13" fill="#7F77DD" opacity="0.5" rx="1"/>
<rect x="36" y="36" width="13" height="13" fill="#7F77DD" opacity="0.6" rx="1"/>
<rect x="52" y="36" width="13" height="13" fill="#7F77DD" opacity="0.35" rx="1"/>
<rect x="4" y="52" width="13" height="13" fill="#7F77DD" opacity="0.4" rx="1"/>
<rect x="20" y="52" width="13" height="13" fill="#7F77DD" opacity="0.2" rx="1"/>
<rect x="36" y="52" width="13" height="13" fill="#7F77DD" opacity="0.35" rx="1"/>
<rect x="52" y="52" width="13" height="13" fill="#7F77DD" opacity="0.6" rx="1"/>
</g>
<text class="sub" x="110" y="148" text-anchor="middle">Attention bidirectionnelle</text>
<text class="sub" x="110" y="164" text-anchor="middle">Toutes positions visibles</text>

<!-- Block internals -->
<rect x="40" y="184" width="140" height="34" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="label" x="110" y="201" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Self-attention</text>

<rect x="56" y="228" width="108" height="26" rx="4" fill="#F0F0F0" stroke="#B4B2A9" stroke-width="0.5" class="gray-box"/>
<text class="sub" x="110" y="241" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">+ résid. + LN</text>

<rect x="40" y="264" width="140" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="label" x="110" y="281" text-anchor="middle" dominant-baseline="central" fill="#085041">FFN</text>

<rect x="56" y="308" width="108" height="26" rx="4" fill="#F0F0F0" stroke="#B4B2A9" stroke-width="0.5" class="gray-box"/>
<text class="sub" x="110" y="321" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">+ résid. + LN</text>

<!-- Bracket ×N -->
<path d="M185 184 L195 184 L195 334 L185 334" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="sub" x="202" y="262" text-anchor="start">×N</text>

<line x1="110" y1="334" x2="110" y2="360" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>
<text class="sub" x="110" y="376" text-anchor="middle">Représentations</text>
<text class="sub" x="110" y="396" text-anchor="middle" opacity="0.5">Classification, recherche</text>


<!-- === COLUMN 2: Decoder (GPT) === -->
<!-- Divider -->
<line x1="228" y1="10" x2="228" y2="470" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4" class="divider"/>

<text class="label" x="340" y="24" text-anchor="middle">Décodeur</text>
<text class="sub" x="340" y="40" text-anchor="middle">GPT</text>

<!-- Attention matrix: lower triangular (causal) -->
<g transform="translate(302, 56)">
<rect width="76" height="76" fill="white" stroke="#D3D1C7" stroke-width="0.5" rx="4" class="matrix-bg"/>
<!-- Lower triangle -->
<rect x="4" y="4" width="13" height="13" fill="#EF9F27" opacity="0.6" rx="1"/>
<rect x="20" y="4" width="13" height="13" fill="#F0F0F0" opacity="0.5" rx="1" class="masked-cell"/>
<rect x="36" y="4" width="13" height="13" fill="#F0F0F0" opacity="0.5" rx="1" class="masked-cell"/>
<rect x="52" y="4" width="13" height="13" fill="#F0F0F0" opacity="0.5" rx="1" class="masked-cell"/>
<rect x="4" y="20" width="13" height="13" fill="#EF9F27" opacity="0.3" rx="1"/>
<rect x="20" y="20" width="13" height="13" fill="#EF9F27" opacity="0.6" rx="1"/>
<rect x="36" y="20" width="13" height="13" fill="#F0F0F0" opacity="0.5" rx="1" class="masked-cell"/>
<rect x="52" y="20" width="13" height="13" fill="#F0F0F0" opacity="0.5" rx="1" class="masked-cell"/>
<rect x="4" y="36" width="13" height="13" fill="#EF9F27" opacity="0.15" rx="1"/>
<rect x="20" y="36" width="13" height="13" fill="#EF9F27" opacity="0.5" rx="1"/>
<rect x="36" y="36" width="13" height="13" fill="#EF9F27" opacity="0.6" rx="1"/>
<rect x="52" y="36" width="13" height="13" fill="#F0F0F0" opacity="0.5" rx="1" class="masked-cell"/>
<rect x="4" y="52" width="13" height="13" fill="#EF9F27" opacity="0.4" rx="1"/>
<rect x="20" y="52" width="13" height="13" fill="#EF9F27" opacity="0.2" rx="1"/>
<rect x="36" y="52" width="13" height="13" fill="#EF9F27" opacity="0.35" rx="1"/>
<rect x="52" y="52" width="13" height="13" fill="#EF9F27" opacity="0.6" rx="1"/>
</g>
<text class="sub" x="340" y="148" text-anchor="middle">Attention causale</text>
<text class="sub" x="340" y="164" text-anchor="middle">Futur masqué (−∞)</text>

<!-- Block internals -->
<rect x="270" y="184" width="140" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="label" x="340" y="201" text-anchor="middle" dominant-baseline="central" fill="#633806">Masked self-attn</text>

<rect x="286" y="228" width="108" height="26" rx="4" fill="#F0F0F0" stroke="#B4B2A9" stroke-width="0.5" class="gray-box"/>
<text class="sub" x="340" y="241" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">+ résid. + LN</text>

<rect x="270" y="264" width="140" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="label" x="340" y="281" text-anchor="middle" dominant-baseline="central" fill="#085041">FFN</text>

<rect x="286" y="308" width="108" height="26" rx="4" fill="#F0F0F0" stroke="#B4B2A9" stroke-width="0.5" class="gray-box"/>
<text class="sub" x="340" y="321" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">+ résid. + LN</text>

<path d="M415 184 L425 184 L425 334 L415 334" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="sub" x="432" y="262" text-anchor="start">×N</text>

<line x1="340" y1="334" x2="340" y2="360" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>
<text class="sub" x="340" y="376" text-anchor="middle">Mot suivant</text>
<text class="sub" x="340" y="396" text-anchor="middle" opacity="0.5">Génération, LLM</text>


<!-- === COLUMN 3: Encoder-Decoder === -->
<line x1="458" y1="10" x2="458" y2="470" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4" class="divider"/>

<text class="label" x="570" y="24" text-anchor="middle">Enc-Déc</text>
<text class="sub" x="570" y="40" text-anchor="middle">Traduction</text>

<!-- Encoder mini-box -->
<rect x="500" y="72" width="140" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="label" x="570" y="88" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Encodeur</text>
<text class="sub" x="570" y="106" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Bidirectionnel</text>

<!-- Decoder block with cross-attention -->
<rect x="500" y="184" width="140" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="label" x="570" y="201" text-anchor="middle" dominant-baseline="central" fill="#633806">Masked self-attn</text>

<rect x="516" y="228" width="108" height="26" rx="4" fill="#F0F0F0" stroke="#B4B2A9" stroke-width="0.5" class="gray-box"/>
<text class="sub" x="570" y="241" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">+ résid. + LN</text>

<rect x="500" y="264" width="140" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="label" x="570" y="281" text-anchor="middle" dominant-baseline="central" fill="#712B13">Cross-attention</text>

<rect x="516" y="308" width="108" height="26" rx="4" fill="#F0F0F0" stroke="#B4B2A9" stroke-width="0.5" class="gray-box"/>
<text class="sub" x="570" y="321" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">+ résid. + LN</text>

<rect x="500" y="344" width="140" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="label" x="570" y="361" text-anchor="middle" dominant-baseline="central" fill="#085041">FFN</text>

<rect x="516" y="388" width="108" height="26" rx="4" fill="#F0F0F0" stroke="#B4B2A9" stroke-width="0.5" class="gray-box"/>
<text class="sub" x="570" y="401" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">+ résid. + LN</text>

<!-- Arrow from encoder to cross-attention -->
<path d="M570 116 L570 140 L490 140 L490 281 L498 281" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arr)"/>
<text class="sub" x="484" y="200" text-anchor="end" fill="#D85A30">K, V</text>

<path d="M645 184 L655 184 L655 414 L645 414" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="sub" x="662" y="302" text-anchor="start">×N</text>

<line x1="570" y1="414" x2="570" y2="440" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>
<text class="sub" x="570" y="456" text-anchor="middle">Traduction</text>
<text class="sub" x="570" y="472" text-anchor="middle" opacity="0.5">Résumé, Q&amp;A</text>

</svg>
