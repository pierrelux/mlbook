<svg width="100%" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif;">
<style>
  text { fill: #333333; }
  .label { font-size: 14px; font-weight: 500; }
  .sub { font-size: 12px; fill: #737373; }
  @media (prefers-color-scheme: dark) {
    text { fill: #c2c0b6; }
    .sub { fill: #9c9a92; }
    .add-circle { fill: #2C2C2A; }
    .ln-box { fill: #444441; stroke: #B0B0B0; }
  }
</style>

<!-- Top: Sortie label -->
<text class="sub" x="240" y="20" text-anchor="middle">Sortie ∈ ℝᵀˣᵈ</text>

<!-- LayerNorm 2 (y=36..68) -->
<rect x="170" y="36" width="140" height="32" rx="6" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="0.5" class="ln-box"/>
<text class="label" x="240" y="52" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">LayerNorm</text>

<!-- Residual stream: top segment (68 down to 260) -->
<line x1="240" y1="68" x2="240" y2="260" stroke="#888780" stroke-width="3" stroke-linecap="round"/>

<!-- Addition circle 2 (cy=96) -->
<circle cx="240" cy="96" r="12" fill="white" stroke="#888780" stroke-width="1" class="add-circle"/>
<text x="240" y="96" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#333333">+</text>

<!-- Return line from FFN back to addition circle -->
<path d="M340 140 L340 96 L254 96" fill="none" stroke="#888780" stroke-width="1.5"/>
<polygon points="254,92 244,96 254,100" fill="#888780"/>

<!-- FFN box (y=140..200) -->
<rect x="290" y="140" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="label" x="390" y="162" text-anchor="middle" dominant-baseline="central" fill="#085041">FFN</text>
<text class="sub" x="390" y="182" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">MLP à 2 couches</text>

<!-- Branch from stream to FFN (at y=230) -->
<circle cx="240" cy="230" r="4" fill="#888780"/>
<path d="M240 230 L340 230 L340 200" fill="none" stroke="#888780" stroke-width="1.5"/>

<!-- LayerNorm 1 (y=260..292) -->
<rect x="170" y="260" width="140" height="32" rx="6" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="0.5" class="ln-box"/>
<text class="label" x="240" y="276" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">LayerNorm</text>

<!-- Residual stream: bottom segment (292 down to 560) -->
<line x1="240" y1="292" x2="240" y2="560" stroke="#888780" stroke-width="3" stroke-linecap="round"/>

<!-- Addition circle 1 (cy=324) -->
<circle cx="240" cy="324" r="12" fill="white" stroke="#888780" stroke-width="1" class="add-circle"/>
<text x="240" y="324" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="500" fill="#333333">+</text>

<!-- Return line from Attention back to addition circle -->
<path d="M340 370 L340 324 L254 324" fill="none" stroke="#888780" stroke-width="1.5"/>
<polygon points="254,320 244,324 254,328" fill="#888780"/>

<!-- Attention box (y=370..430) -->
<rect x="290" y="370" width="200" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="label" x="390" y="392" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Attention multi-têtes</text>
<text class="sub" x="390" y="412" text-anchor="middle" dominant-baseline="central" fill="#534AB7">H têtes en parallèle</text>

<!-- Branch from stream to Attention (at y=460) -->
<circle cx="240" cy="460" r="4" fill="#888780"/>
<path d="M240 460 L340 460 L340 430" fill="none" stroke="#888780" stroke-width="1.5"/>

<!-- Flux résiduel label — alongside the stream in clear space -->
<text class="label" x="224" y="520" text-anchor="end">Flux résiduel</text>

<!-- Bottom: Input label -->
<text class="sub" x="240" y="590" text-anchor="middle">Entrée X ∈ ℝᵀˣᵈ</text>

<!-- Left annotations — clearly offset from circles -->
<text class="sub" x="110" y="100" text-anchor="end">Addition résiduelle</text>
<line x1="114" y1="100" x2="226" y2="96" stroke="#B0B0B0" stroke-width="0.5" stroke-dasharray="3 3"/>

<text class="sub" x="110" y="328" text-anchor="end">Addition résiduelle</text>
<line x1="114" y1="328" x2="226" y2="324" stroke="#B0B0B0" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Gradient annotation — in clear space along the lower stream -->
<text class="sub" x="140" y="496" text-anchor="end" opacity="0.7">Le gradient circule</text>
<text class="sub" x="140" y="512" text-anchor="end" opacity="0.7">sans atténuation</text>
<line x1="144" y1="504" x2="225" y2="504" fill="none" stroke="#B0B0B0" stroke-width="0.5" stroke-dasharray="3 3"/>
<polygon points="225,501 235,504 225,507" fill="#B0B0B0"/>

</svg>
