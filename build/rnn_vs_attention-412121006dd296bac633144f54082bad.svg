<text class="label" x="68" y="137" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">h₁</text>

<rect x="112" y="120" width="56" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="label" x="140" y="137" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">h₂</text>

<rect x="184" y="120" width="56" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="label" x="212" y="137" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">h₃</text>

<rect x="256" y="120" width="56" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="label" x="284" y="137" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">h₄</text>

<!-- x -> h arrows -->
<line x1="68" y1="84" x2="68" y2="118" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>
<line x1="140" y1="84" x2="140" y2="118" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>
<line x1="212" y1="84" x2="212" y2="118" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>
<line x1="284" y1="84" x2="284" y2="118" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>

<!-- h -> h chain -->
<line x1="96" y1="137" x2="110" y2="137" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>
<line x1="168" y1="137" x2="182" y2="137" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>
<line x1="240" y1="137" x2="254" y2="137" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>

<!-- Highlighted path x1 -> h4 -->
<path d="M68 154 L68 180 L284 180 L284 156" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="5 3"/>
<polygon points="284,158 280,168 288,168" fill="#E24B4A"/>
<text x="176" y="200" text-anchor="middle" font-size="12" fill="#E24B4A">Chemin: T − 1 = 3 étapes</text>

<!-- Output -->
<rect x="256" y="220" width="56" height="34" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="label" x="284" y="237" text-anchor="middle" dominant-baseline="central" fill="#27500A">y₄</text>
<line x1="284" y1="154" x2="284" y2="218" stroke="#888780" stroke-width="0.5" marker-end="url(#arr)"/>

<!-- Bottom labels -->
<text class="sub" x="160" y="276" text-anchor="middle">Séquentiel: O(T) en profondeur</text>
<text class="sub" x="160" y="292" text-anchor="middle">Gradient traverse T−1 matrices</text>


<!-- ===== RIGHT: Self-attention ===== -->
<!-- Input tokens -->
<rect x="380" y="50" width="56" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
