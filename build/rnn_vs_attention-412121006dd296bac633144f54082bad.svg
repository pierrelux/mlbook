<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif;">
<style>
  text { fill: #3d3d3a; }
  .label { font-size: 14px; font-weight: 500; }
  .sub { font-size: 12px; fill: #73726c; }
  @media (prefers-color-scheme: dark) {
    text { fill: #c2c0b6; }
    .sub { fill: #9c9a92; }
    .divider { stroke: #5F5E5A; }
    .box-input { fill: #0C447C; stroke: #85B7EB; }
    .box-input text { fill: #B5D4F4; }
    .box-hidden { fill: #444441; stroke: #B4B2A9; }
    .box-hidden text { fill: #D3D1C7; }
    .box-output { fill: #27500A; stroke: #97C459; }
    .box-output text { fill: #C0DD97; }
    .chain { stroke: #9c9a92; }
    .muted-conn { stroke: #5F5E5A; }
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Section titles -->
<text class="label" x="160" y="24" text-anchor="middle">RNN</text>
<text class="label" x="510" y="24" text-anchor="middle">Auto-attention</text>

<!-- Divider -->
<line x1="335" y1="10" x2="335" y2="310" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 4" class="divider"/>

<!-- ===== LEFT: RNN ===== -->
<!-- Input tokens -->
<rect x="40" y="50" width="56" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="label" x="68" y="67" text-anchor="middle" dominant-baseline="central" fill="#0C447C">x₁</text>

<rect x="112" y="50" width="56" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="label" x="140" y="67" text-anchor="middle" dominant-baseline="central" fill="#0C447C">x₂</text>

<rect x="184" y="50" width="56" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="label" x="212" y="67" text-anchor="middle" dominant-baseline="central" fill="#0C447C">x₃</text>

<rect x="256" y="50" width="56" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="label" x="284" y="67" text-anchor="middle" dominant-baseline="central" fill="#0C447C">x₄</text>

<!-- Hidden states -->
