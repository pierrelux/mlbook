<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, sans-serif;">
<style>
  text { fill: #333333; }
  .label { font-size: 14px; font-weight: 500; }
  .sub { font-size: 12px; fill: #737373; }
  @media (prefers-color-scheme: dark) {
    text { fill: #c2c0b6; }
    .sub { fill: #9c9a92; }
    .trunk-box { fill: #1a3a5c; stroke: #85B7EB; }
    .trunk-label { fill: #B5D4F4; }
    .trunk-sub { fill: #6EA8DE; }
    .layer-box { fill: #444441; stroke: #B0B0B0; }
    .head-classif { fill: #2e2a5e; stroke: #9B93E0; }
    .head-regress { fill: #1a3d32; stroke: #5DBB96; }
  }
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ===== OUTPUT LABELS (top) ===== -->
<text class="sub" x="200" y="24" text-anchor="middle">ŷ ∈ {1, …, K}</text>
<text class="sub" x="480" y="24" text-anchor="middle">ŷ ∈ ℝ</text>

<!-- Arrows from heads to outputs -->
<line x1="200" y1="56" x2="200" y2="32" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="480" y1="56" x2="480" y2="32" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ===== HEAD: Classification (left, purple) ===== -->
<rect x="120" y="56" width="160" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" class="head-classif"/>
<text class="label" x="200" y="74" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Classification</text>
<text class="sub" x="200" y="92" text-anchor="middle" dominant-baseline="central" fill="#534AB7">linéaire + softmax</text>

<!-- ===== HEAD: Régression (right, green) ===== -->
<rect x="400" y="56" width="160" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" class="head-regress"/>
<text class="label" x="480" y="74" text-anchor="middle" dominant-baseline="central" fill="#085041">Régression</text>
<text class="sub" x="480" y="92" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">linéaire</text>

<!-- ===== FORK: trunk to heads ===== -->
<!-- Representation label at fork -->
<text class="label" x="340" y="138" text-anchor="middle">Représentation h</text>

<!-- Fork point -->
<circle cx="340" cy="148" r="4" fill="#888780"/>
<!-- Left branch to classification head -->
<path d="M340 148 L200 148 L200 104" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
<!-- Right branch to regression head -->
<path d="M340 148 L480 148 L480 104" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ===== TRUNK (blue bounding box) ===== -->
<rect x="240" y="180" width="200" height="260" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" class="trunk-box"/>
<text class="label" x="340" y="202" text-anchor="middle" dominant-baseline="central" fill="#0C447C" class="trunk-label">Tronc</text>
<text class="sub" x="340" y="218" text-anchor="middle" dominant-baseline="central" fill="#185FA5" class="trunk-sub">(backbone)</text>

<!-- Arrow from trunk top to fork -->
<line x1="340" y1="180" x2="340" y2="156" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ===== INTERNAL LAYERS (inside trunk) ===== -->
<!-- Top layer -->
<rect x="260" y="242" width="160" height="32" rx="6" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="0.5" class="layer-box"/>
<text class="label" x="340" y="258" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Couche</text>

<!-- Connecting line: top layer down -->
<line x1="340" y1="274" x2="340" y2="284" stroke="#888780" stroke-width="0.5"/>

<!-- Vertical ellipsis -->
<circle cx="340" cy="290" r="2" fill="#B0B0B0"/>
<circle cx="340" cy="300" r="2" fill="#B0B0B0"/>
<circle cx="340" cy="310" r="2" fill="#B0B0B0"/>

<!-- Connecting line: ellipsis to middle layer -->
<line x1="340" y1="316" x2="340" y2="326" stroke="#888780" stroke-width="0.5"/>

<!-- Middle layer -->
<rect x="260" y="326" width="160" height="32" rx="6" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="0.5" class="layer-box"/>
<text class="label" x="340" y="342" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Couche</text>

<!-- Connecting line: middle to bottom layer -->
<line x1="340" y1="358" x2="340" y2="378" stroke="#888780" stroke-width="0.5"/>

<!-- Bottom layer -->
<rect x="260" y="378" width="160" height="32" rx="6" fill="#F0F0F0" stroke="#B0B0B0" stroke-width="0.5" class="layer-box"/>
<text class="label" x="340" y="394" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Couche</text>

<!-- ×N bracket (right side) -->
<path d="M425 242 L435 242 L435 410 L425 410" fill="none" stroke="#888780" stroke-width="0.5"/>
<text class="sub" x="442" y="330" text-anchor="start">×N</text>

<!-- ===== ARROW: input to trunk ===== -->
<line x1="340" y1="490" x2="340" y2="442" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- ===== INPUT LABEL (bottom) ===== -->
<text class="sub" x="340" y="506" text-anchor="middle">Entrée x (pixels, mots, …)</text>

<!-- ===== ANNOTATIONS ===== -->
<!-- Left annotation: transferable features -->
<text class="sub" x="110" y="332" text-anchor="end" opacity="0.7">Caractéristiques</text>
<text class="sub" x="110" y="348" text-anchor="end" opacity="0.7">transférables</text>
<line x1="114" y1="340" x2="238" y2="340" stroke="#B0B0B0" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Right annotation: task-specific -->
<text class="sub" x="596" y="72" text-anchor="start" opacity="0.7">Spécifique</text>
<text class="sub" x="596" y="88" text-anchor="start" opacity="0.7">à la tâche</text>
<line x1="562" y1="80" x2="592" y2="80" stroke="#B0B0B0" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Left label for "Tête" -->
<text class="sub" x="92" y="72" text-anchor="end" font-weight="500">Tête</text>
<text class="sub" x="92" y="88" text-anchor="end">(head)</text>
<line x1="96" y1="80" x2="116" y2="80" stroke="#B0B0B0" stroke-width="0.5" stroke-dasharray="3 3"/>

</svg>
