<h2 id="impl%C3%A9mentation-stable">Implémentation stable</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">softmax_naive</span>(<span class="hljs-params">a</span>):
    <span class="hljs-string">&quot;&quot;&quot;Version naïve - déborde pour grands logits&quot;&quot;&quot;</span>
    <span class="hljs-keyword">return</span> np.exp(a) / np.<span class="hljs-built_in">sum</span>(np.exp(a))

<span class="hljs-keyword">def</span> <span class="hljs-title function_">softmax_stable</span>(<span class="hljs-params">a</span>):
    <span class="hljs-string">&quot;&quot;&quot;Version stable - soustrait le max&quot;&quot;&quot;</span>
    a_max = np.<span class="hljs-built_in">max</span>(a)
    exp_a = np.exp(a - a_max)
    <span class="hljs-keyword">return</span> exp_a / np.<span class="hljs-built_in">sum</span>(exp_a)
</code></pre>

<h2 id="pourquoi-%C3%A7a-fonctionne">Pourquoi ça fonctionne?</h2>
<p>L'hypothèse d'indépendance est presque toujours <strong>violée</strong> en pratique.</p>
<p>Pourtant, Naive Bayes fonctionne souvent bien. Pourquoi?</p>
<table>
<thead>
<tr>
<th>Observation</th>
<th>Explication</th>
</tr>
</thead>
<tbody>
<tr>
<td>On classe, on n'estime pas</td>
<td>Seul l'ordre des probabilités compte</td>
</tr>
<tr>
<td>Erreurs qui s'annulent</td>
<td>Surestimation dans toutes les classes</td>
</tr>
<tr>
<td>Régularisation implicite</td>
<td>Modèle simple = moins de surapprentissage</td>
</tr>
</tbody>
</table>
<p><strong>Attention</strong> : Les probabilités retournées sont souvent mal calibrées (trop proches de 0 ou 1). Pour des probabilités fiables, préférez la régression logistique.</p>

<p>Le <strong>partitionnement</strong> (<em>clustering</em>) cherche à regrouper les données en groupes homogènes.</p>
<p>Les <strong>modèles de mélange gaussien</strong> (GMM) offrent une approche probabiliste qui généralise l'analyse discriminante au cas non supervisé.</p>

<h2 id="convergence-de-lalgorithme-em">Convergence de l'algorithme EM</h2>
<p><img src="../_static/em_convergence.gif" alt="" style="width:800px;" /></p>
<p>À partir d'une initialisation arbitraire, EM ajuste progressivement les composants. Les ellipses représentent les contours à 1 et 2 écarts-types.</p>

<h2 id="pseudocode-de-lalgorithme-em">Pseudocode de l'algorithme EM</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Entrée: Données X, nombre de composants K
1. Initialiser les paramètres θ = (π, μ, Σ)
2. Répéter jusqu'à convergence:
   a. Étape E: calculer les responsabilités r_nk
   b. Étape M: mettre à jour π, μ, Σ
   c. Calculer la log-vraisemblance
3. Vérifier la convergence (ΔLL &lt; ε)
Sortie: Paramètres θ et responsabilités r
</code></pre>
<p>EM garantit que la log-vraisemblance <strong>augmente</strong> (ou reste stable) à chaque itération.</p>
