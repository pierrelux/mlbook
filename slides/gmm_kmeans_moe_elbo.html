<h2 id="pourquoi-le-partitionnement">Pourquoi le partitionnement?</h2>
<p>Les étiquettes de classe ne sont pas toujours disponibles. Un biologiste mesure des fleurs sans connaître l'espèce, un commerce enregistre des transactions sans profil client, un généticien séquence des tumeurs sans sous-type défini.</p>
<p>Le partitionnement (<em>clustering</em>) regroupe les observations en groupes homogènes, sans supervision.</p>
<p><img src="_static/clustering_motivation.png" alt="" style="width:850px;" /></p>

<h2 id="r%C3%A9gions-dassignation--le-diagramme-de-vorono%C3%AF">Régions d'assignation : le diagramme de Voronoï</h2>
<p>Puisque chaque point est assigné au centroïde le plus proche au sens euclidien, la séparation entre deux groupes adjacents est la <strong>médiatrice</strong> du segment reliant leurs centroïdes : une droite perpendiculaire passant par le milieu.</p>
<p>L'ensemble de ces médiatrices forme un <strong>diagramme de Voronoï</strong> dont les cellules sont des polygones convexes.</p>
<table>
<thead>
<tr>
<th>Conséquence</th>
<th>Implication</th>
</tr>
</thead>
<tbody>
<tr>
<td>Séparations linéaires</td>
<td>Les groupes sont séparés par des droites</td>
</tr>
<tr>
<td>Cellules convexes</td>
<td>Les groupes sont nécessairement « sphériques »</td>
</tr>
<tr>
<td>Indépendant de la forme réelle</td>
<td>K-moyennes ne peut pas capturer des groupes allongés</td>
</tr>
</tbody>
</table>
<footer><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4d6.svg" data-marp-twemoji=""/> Chapitre 6 : Modèles probabilistes génératifs</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="📖 Chapitre 6 : Modèles probabilistes génératifs" data-theme="mila" lang="en-CA" data-marpit-pagination="10" style="--paginate:true;--footer:📖 Chapitre 6 : Modèles probabilistes génératifs;--theme:mila;" data-marpit-pagination-total="49">
<h2 id="k-moyennes-et-ses-limites">K-moyennes et ses limites</h2>
<p><img src="_static/kmeans_centroids.png" alt="" style="width:850px;" /></p>
<p>K-moyennes fonctionne bien quand les groupes sont compacts et de taille comparable. Il échoue quand les groupes ont des formes elliptiques, des tailles différentes, ou se chevauchent.</p>
<footer><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4d6.svg" data-marp-twemoji=""/> Chapitre 6 : Modèles probabilistes génératifs</footer>
</section>

<h2 id="r%C3%A9sum%C3%A9--k-moyennes">Résumé : k-moyennes</h2>
<table>
<thead>
<tr>
<th>Élément</th>
<th>Détail</th>
</tr>
</thead>
<tbody>
<tr>
<td>Objectif</td>
<td>Minimiser la distorsion <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.432ex" height="1.595ex" role="img" focusable="false" viewBox="0 -683 633 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43D" d="M447 625Q447 637 354 637H329Q323 642 323 645T325 664Q329 677 335 683H352Q393 681 498 681Q541 681 568 681T605 682T619 682Q633 682 633 672Q633 670 630 658Q626 642 623 640T604 637Q552 637 545 623Q541 610 483 376Q420 128 419 127Q397 64 333 21T195 -22Q137 -22 97 8T57 88Q57 130 80 152T132 174Q177 174 182 130Q182 98 164 80T123 56Q115 54 115 53T122 44Q148 15 197 15Q235 15 271 47T324 130Q328 142 387 380T447 625Z"></path></g></g></g></svg></mjx-container></td>
</tr>
<tr>
<td>Assignation</td>
<td>Dure : chaque point à un seul groupe</td>
</tr>
<tr>
<td>Frontières</td>
<td>Médiatrices (Voronoï)</td>
</tr>
<tr>
<td>Convergence</td>
<td>Garantie (décroissance de <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.432ex" height="1.595ex" role="img" focusable="false" viewBox="0 -683 633 705"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43D" d="M447 625Q447 637 354 637H329Q323 642 323 645T325 664Q329 677 335 683H352Q393 681 498 681Q541 681 568 681T605 682T619 682Q633 682 633 672Q633 670 630 658Q626 642 623 640T604 637Q552 637 545 623Q541 610 483 376Q420 128 419 127Q397 64 333 21T195 -22Q137 -22 97 8T57 88Q57 130 80 152T132 174Q177 174 182 130Q182 98 164 80T123 56Q115 54 115 53T122 44Q148 15 197 15Q235 15 271 47T324 130Q328 142 387 380T447 625Z"></path></g></g></g></svg></mjx-container>), mais maximum local</td>

<p>Comment dépasser ces limitations? En remplaçant les assignations dures par des assignations souples et les sphères par des ellipsoïdes.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="📖 Chapitre 6 : Modèles probabilistes génératifs" data-theme="mila" lang="en-CA" data-marpit-pagination="13" style="--paginate:true;--footer:📖 Chapitre 6 : Modèles probabilistes génératifs;--theme:mila;" data-marpit-pagination-total="49">
<h2 id="du-discret-au-probabiliste">Du discret au probabiliste</h2>
<p>K-moyennes assigne chaque point à un seul groupe. Mais un point situé entre deux centroïdes pourrait raisonnablement appartenir à l'un ou l'autre. Pourquoi ne pas quantifier cette incertitude?</p>
<p>L'idée : modéliser les données comme un <strong>mélange</strong> de <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> distributions gaussiennes, chacune représentant un groupe. La probabilité qu'un point appartienne à un groupe remplace l'assignation binaire.</p>

<h2 id="convergence-de-lalgorithme-em">Convergence de l'algorithme EM</h2>
<p><img src="_static/em_convergence.gif" alt="" style="width:800px;" /></p>

<h1 id="elbo-et-inf%C3%A9rence-variationnelle">ELBO et inférence variationnelle</h1>
<h2 id="pourquoi-em-converge">Pourquoi EM converge</h2>
<footer><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4d6.svg" data-marp-twemoji=""/> Chapitre 6 : Modèles probabilistes génératifs</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="📖 Chapitre 6 : Modèles probabilistes génératifs" data-theme="mila" lang="en-CA" data-marpit-pagination="29" style="--paginate:true;--footer:📖 Chapitre 6 : Modèles probabilistes génératifs;--theme:mila;" data-marpit-pagination-total="49">
<h2 id="la-question">La question</h2>
<p>Nous avons affirmé que la log-vraisemblance augmente à chaque itération d'EM. Mais pourquoi? Y a-t-il un objectif que chaque étape améliore?</p>
<p>La réponse repose sur une <strong>borne inférieure</strong> de la log-vraisemblance, appelée ELBO (<em>Evidence Lower Bound</em>). Nous allons la construire, puis montrer que les étapes E et M la maximisent par alternance.</p>

</section>

<h2 id="sch%C3%A9ma-de-la-convergence">Schéma de la convergence</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Itération t                          Itération t+1
                                     
     log p(X|θ)  ─────────────────────── log p(X|θ')
         │                                   │
    KL &gt; 0                              KL = 0
         │                                   │
    ELBO(q_old, θ)                     ELBO(q_new, θ)
                                             │
                    Étape E                  │
                  (q → post.)          ELBO(q_new, θ)
                                             │
                    Étape M                  │
                  (θ → θ')             ELBO(q_new, θ')
</code></pre>
<p>L'étape E serre la borne (KL → 0). L'étape M pousse la borne vers le haut.</p>

<h2 id="du-partitionnement-%C3%A0-la-pr%C3%A9diction">Du partitionnement à la prédiction</h2>
<p>Un GMM partitionne l'espace des observations en groupes, mais il ne fait pas de prédiction.</p>
<p>Considérons des données où la relation entre <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.294ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 572 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g></g></g></svg></mjx-container> et <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="1.109ex" height="1.464ex" role="img" focusable="false" viewBox="0 -442 490 647"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D466" d="M21 287Q21 301 36 335T84 406T158 442Q199 442 224 419T250 355Q248 336 247 334Q247 331 231 288T198 191T182 105Q182 62 196 45T238 27Q261 27 281 38T312 61T339 94Q339 95 344 114T358 173T377 247Q415 397 419 404Q432 431 462 431Q475 431 483 424T494 412T496 403Q496 390 447 193T391 -23Q363 -106 294 -155T156 -205Q111 -205 77 -183T43 -117Q43 -95 50 -80T69 -58T89 -48T106 -45Q150 -45 150 -87Q150 -107 138 -122T115 -142T102 -147L99 -148Q101 -153 118 -160T152 -167H160Q177 -167 186 -165Q219 -156 247 -127T290 -65T313 -9T321 21L315 17Q309 13 296 6T270 -6Q250 -11 231 -11Q185 -11 150 11T104 82Q103 89 103 113Q103 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> change selon la région : un système physique avec plusieurs régimes, ou un marché dont la dynamique varie selon la conjoncture.</p>
<p>Un seul modèle linéaire ne peut pas capturer ces régimes. Mais si l'on dispose de <strong>plusieurs modèles linéaires</strong> (un par régime) et d'un <strong>mécanisme de routage</strong> pour aiguiller chaque observation vers le bon modèle, on obtient une prédiction flexible à partir de composants simples.</p>

<h2 id="le-probl%C3%A8me">Le problème</h2>
<p><img src="_static/moe_convergence.gif" alt="center" style="width:700px;" /></p>
<p>Un modèle linéaire unique (trait pointillé) ne capture pas les changements de pente. Le mélange d'experts (lignes colorées) spécialise chaque expert dans une région.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="📖 Chapitre 6 : Modèles probabilistes génératifs" data-theme="mila" lang="en-CA" data-marpit-pagination="43" style="--paginate:true;--footer:📖 Chapitre 6 : Modèles probabilistes génératifs;--theme:mila;" data-marpit-pagination-total="49">
<h2 id="pourquoi-le-routage-d%C3%A9pendant-de-lentr%C3%A9e">Pourquoi le routage dépendant de l'entrée?</h2>
<p>Avec des poids <strong>fixes</strong> (comme dans un GMM), les experts peinent à se spécialiser : chacun tente de couvrir l'ensemble des données.</p>
<p>Avec un routage <strong>dépendant de l'entrée</strong>, chaque expert se concentre sur la région où il excelle, et la prédiction suit la structure par morceaux des données.</p>
<table>
<thead>
<tr>
<th>Poids fixes</th>
<th>Routage adaptatif</th>
</tr>
</thead>
<tbody>
<tr>
<td>Experts généralistes</td>
<td>Experts spécialisés</td>
</tr>
<tr>
<td>Prédiction = compromis</td>
<td>Prédiction = expert local</td>
</tr>
<tr>
<td>Comme un GMM sur <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="5.169ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2284.7 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(389,0)"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g><g data-mml-node="mo" transform="translate(961,0)"><path data-c="2C" d="M78 35T78 60T94 103T137 121Q165 121 187 96T210 8Q210 -27 201 -60T180 -117T154 -158T130 -185T117 -194Q113 -194 104 -185T95 -172Q95 -168 106 -156T131 -126T157 -76T173 -3V9L172 8Q170 7 167 6T161 3T152 1T140 0Q113 0 96 17Z"></path></g><g data-mml-node="mi" transform="translate(1405.7,0)"><path data-c="1D466" d="M21 287Q21 301 36 335T84 406T158 442Q199 442 224 419T250 355Q248 336 247 334Q247 331 231 288T198 191T182 105Q182 62 196 45T238 27Q261 27 281 38T312 61T339 94Q339 95 344 114T358 173T377 247Q415 397 419 404Q432 431 462 431Q475 431 483 424T494 41 <h2 id="convergence-du-m%C3%A9lange-dexperts">Convergence du mélange d'experts</h2>
<p><img src="_static/moe_convergence.gif" alt="" style="width:800px;" /></p>
<p>L'animation montre l'alternance E/M : les experts (droites colorées) se spécialisent progressivement, tandis que le réseau de routage apprend à aiguiller les observations.</p>
<footer><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4d6.svg" data-marp-twemoji=""/> Chapitre 6 : Modèles probabilistes génératifs</footer>

<h2 id="moe-en-apprentissage-profond">MoE en apprentissage profond</h2>
<p>Les notions de routage et de spécialisation réapparaissent dans les grands modèles de langage (LLM) et l'apprentissage profond.</p>
<table>
<thead>
<tr>
<th>Concept du cours</th>
<th>Équivalent en DL</th>
</tr>
</thead>
<tbody>
<tr>
<td>Expert (modèle linéaire)</td>
<td>Sous-réseau spécialisé</td>
</tr>
<tr>
<td>Réseau de routage</td>
<td>Couche de gating</td>
</tr>
<tr>
<td><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> experts actifs</td>
<td>Routage « sparse » (quelques experts actifs)</td>
</tr>
</tbody>
</table>
<p>Des modèles comme Mixtral utilisent des couches MoE pour augmenter la capacité du réseau sans augmenter proportionnellement le coût de calcul : seuls quelques experts sont activés pour chaque entrée.</p>
<p>Nous reviendrons sur ces architectures quand nous aborderons les réseaux de neurones.</p>

<footer><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4d6.svg" data-marp-twemoji=""/> Chapitre 6 : Modèles probabilistes génératifs</footer>

<h2 id="les-mod%C3%A8les-vus-aujourdhui">Les modèles vus aujourd'hui</h2>
<table>
<thead>
<tr>
<th>Modèle</th>
<th>Assignation</th>
<th>Forme des groupes</th>
<th>Cadre</th>
</tr>
</thead>
<tbody>
<tr>
<td>K-moyennes</td>
<td>Dure</td>
<td>Sphérique</td>
<td>Non supervisé</td>
</tr>
<tr>
<td>GMM</td>
<td>Souple</td>
<td>Elliptique</td>
<td>Non supervisé</td>
</tr>
<tr>
<td>Mélange d'experts</td>
<td>Souple, dépend de <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.373ex" height="1.005ex" role="img" focusable="false" viewBox="0 -444 607 444"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="1D431" d="M227 0Q212 3 121 3Q40 3 28 0H21V62H117L245 213L109 382H26V444H34Q49 441 143 441Q247 441 265 444H274V382H246L281 339Q315 297 316 297Q320 297 354 341L389 382H352V444H360Q375 441 466 441Q547 441 559 444H566V382H471L355 246L504 63L545 62H586V0H578Q563 3 469 3Q365 3 347 0H338V62H366Q366 63 326 112T285 163L198 63L217 62H235V0H227Z"></path></g></g></g></g></svg></mjx-container></td>
<td>N/A (régression)</td>
<td>Supervisé</td>
</tr>
</tbody>
</table>
<p>L'algorithme EM estime les paramètres dans les trois cas par alternance E/M.</p>
<p>La convergence est garantie par la monotonie de l'ELBO : chaque E-step serre la borne, chaque M-step la pousse vers le haut.</p>
