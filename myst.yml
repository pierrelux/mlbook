    '\Var': '\mathrm{Var}'
    '\Cov': '\mathrm{Cov}'
    '\Prob': '\mathbb{P}'
    '\R': '\mathbb{R}'
    '\N': '\mathbb{N}'
    '\Loss': '\mathcal{L}'
    '\Risk': '\mathcal{R}'
    '\Hypothesis': '\mathcal{H}'
    '\Data': '\mathcal{D}'
    '\indicator': '\mathbb{1}'
    '\defeq': '\triangleq'
    '\mathds': '\mathbb'
    '\hdots': '\cdots'
  exports:
    - format: pdf
      output: exports/book.pdf
