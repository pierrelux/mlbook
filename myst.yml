  title: "Fondements de l'apprentissage machine"
  description: "Un manuel d'introduction à l'apprentissage machine couvrant les méthodes supervisées et non-supervisées, des algorithmes classiques aux réseaux de neurones modernes."
  authors:
    - name: Pierre-Luc Bacon
  github: https://github.com/pierrelux/mlbook
  bibliography:
    - references.bib
